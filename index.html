<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161f32;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-color: #10b981;
      --accent-gradient: linear-gradient(135deg, #10b981, #059669);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Padauk', 'Poppins', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 20px; }
    header { width: 100%; background: rgba(22, 31, 50, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--card-border); padding: 16px 20px; position: sticky; top: 0; z-index: 100; text-align: center; }
    .brand h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #34d399, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .live-date { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .nav-tabs { display: inline-flex; background: rgba(15, 23, 42, 0.6); padding: 4px; border-radius: 30px; margin-top: 14px; border: 1px solid var(--card-border); }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 8px 20px; border-radius: 25px; cursor: pointer; font-size: 14px; font-weight: 700; font-family: inherit; }
    .tab-btn.active { background: var(--accent-gradient); color: #ffffff; }
    main { width: 100%; max-width: 650px; padding: 20px 16px; }
    .section { display: none; }
    .section.active { display: block; }
    .news-card { background: var(--card-bg); border-radius: 16px; padding: 18px; margin-bottom: 16px; border: 1px solid var(--card-border); }
    .news-badge { display: inline-block; background: rgba(16, 185, 129, 0.15); color: var(--accent-color); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; margin-bottom: 10px; }
    .news-title { font-size: 17px; font-weight: 700; color: var(--text-main); margin-bottom: 10px; line-height: 1.5; }
    .news-snippet { font-size: 14px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.6; }
    .news-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.05); font-size: 13px; }
    .read-btn { color: var(--accent-color); text-decoration: none; font-weight: 700; }
    .widget-card { background: var(--card-bg); border-radius: 16px; padding: 8px; border: 1px solid var(--card-border); }
    .loading { text-align: center; color: var(--text-muted); padding: 40px 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><h1>⚽ FOOTBALL HUB</h1></div>
    <div class="live-date" id="current-date">Loading...</div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('news', this)">သတင်းများ</button>
      <button class="tab-btn" onclick="switchTab('matches', this)">ပွဲစဉ်နှင့် ရလဒ်များ</button>
    </div>
  </header>
  <main>
    <div id="news-section" class="section active">
      <div id="news-container"><div class="loading">သတင်းများ ရယူနေပါသည်...</div></div>
    </div>
    <div id="matches-section" class="section">
      <div class="widget-card">
        <iframe src="https://www.scorebat.com/embed/livescore/" width="100%" height="600" style="border:none; overflow:hidden;" scrolling="no"></iframe>
      </div>
    </div>
  </main>
  <script>
    function updateDate() {
      const now = new Date();
      document.getElementById('current-date').innerText = now.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    }
    updateDate();
    function switchTab(tabName, btnElement) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
      btnElement.classList.add('active');
      document.getElementById(tabName + '-section').classList.add('active');
    }
    async function fetchNews() {
      const container = document.getElementById('news-container');
      const rssUrl = encodeURIComponent('https://www.skysports.com/rss/12040');
      try {
        const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`);
        const data = await response.json();
        if (data.status === 'ok') {
          container.innerHTML = '';
          data.items.slice(0, 10).forEach(item => {
            const card = document.createElement('div');
            card.className = 'news-card';
            card.innerHTML = `
              <span class="news-badge">LATEST NEWS</span>
              <div class="news-title">${item.title}</div>
              <div class="news-snippet">${item.description.replace(/<[^>]*>?/gm, '').substring(0, 120)}...</div>
              <div class="news-footer">
                <span>📅 ${new Date(item.pubDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                <a href="${item.link}" target="_blank" class="read-btn">ဖတ်ရှုရန် ➔</a>
              </div>
            `;
            container.appendChild(card);
          });
        }
      } catch (e) { container.innerHTML = 'သတင်းများ ရယူ၍ မရနိုင်ပါ။'; }
    }
    fetchNews();
  </script>
</body>
</html>
